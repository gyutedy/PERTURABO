name: PERTURABO — F04_COPYWRITER PUR (VOX direct)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL VOD traitée par VOX'
        required: true
        default: 'https://www.twitch.tv/videos/2864600351'
      candidats_path:
        description: 'Chemin candidats.json VOX (repo-relatif)'
        required: false
        default: 'MONDES_FORGES/CLIPPING/ARCHIVUM/montage/transcripts/v2864600351_candidats.json'
      platform:
        description: 'Plateforme cible'
        required: false
        default: 'youtube_shorts'
      market:
        description: 'Marché cible'
        required: false
        default: 'us_young_english'
      nb_videos:
        description: 'Nombre de vidéos finales (1-10) — détermine le nombre d''assets'
        required: false
        default: '1'
      asset_mode:
        description: 'Type de contenu : ranking | blur | split | overlay_only'
        required: false
        default: 'ranking'
      example_description:
        description: 'Exemple de description fourni par l''opérateur (guide F04)'
        required: false
        default: ''

jobs:
  copywriting:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      NVIDIA_NIM_MODEL: openai/gpt-oss-20b
      CLIPPING_PREMIUM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Adaptateur PUR direct (VOX -> angles + specimen, contrat opérateur)
        run: |
          python MONDES_FORGES/CLIPPING/pur_adapter_direct.py \
            --candidats "${{ inputs.candidats_path }}" \
            --vod "${{ inputs.vod_url }}" \
            --platform "${{ inputs.platform }}" \
            --market "${{ inputs.market }}" \
            --nb-videos "${{ inputs.nb_videos }}" \
            --asset-mode "${{ inputs.asset_mode }}"

      - name: Write fresh liber (mode whop, overrides stale logo/meme_v2)
        run: |
          cat > MONDES_FORGES/CLIPPING/liber_clipping.json <<'EOF'
          {
            "mode": "whop",
            "sub_mode": "pur",
            "campaign_id": "2026-07-24_AISHAH_SOFEY_MULTI",
            "campaign_status": "active",
            "inputs_warsmith": {
              "platform_target": "${{ inputs.platform }}",
              "market_target": "${{ inputs.market }}",
              "nb_videos_finales": ${{ inputs.nb_videos || 1 }},
              "asset_mode": "${{ inputs.asset_mode || 'ranking' }}",
              "exemple_description": "${{ inputs.example_description }}"
            }
          }
          EOF
          echo "liber_clipping.json -> mode whop (flux PUR direct + contrat opérateur)"

      - name: Write operator_brief (contrat opérateur pour F04)
        run: |
          mkdir -p MONDES_FORGES/CLIPPING/F04_COPYWRITER/IN
          cat > MONDES_FORGES/CLIPPING/F04_COPYWRITER/IN/operator_brief.json <<'EOF'
          {
            "nb_videos_finales": ${{ inputs.nb_videos || 1 }},
            "asset_mode": "${{ inputs.asset_mode || 'ranking' }}",
            "platform_target": "${{ inputs.platform }}",
            "market_target": "${{ inputs.market }}",
            "exemple_description": "${{ inputs.example_description }}"
          }
          EOF
          echo "operator_brief.json -> contrat opérateur en place"

      - name: Write copywriter_secrets.json (NVIDIA, provider other)
        run: |
          mkdir -p MONDES_FORGES/CLIPPING/CONTRACTS
          cat > MONDES_FORGES/CLIPPING/CONTRACTS/copywriter_secrets.json <<'EOF'
          {
            "env_var_name": "CLIPPING_PREMIUM_API_KEY",
            "model_id": "openai/gpt-oss-20b",
            "provider": "other",
            "base_url": "https://integrate.api.nvidia.com/v1",
            "max_tokens_per_call": 4096,
            "timeout_seconds": 600,
            "max_retries": 3,
            "retry_base_delay": 2.0,
            "temperature_default": 0.7
          }
          EOF
          echo "copywriter_secrets.json -> NVIDIA (gpt-oss-20b)"

      - name: F04 assets par clip (résilient — retry + commit par clip)
        run: |
          NB="${{ inputs.nb_videos || 1 }}"
          MODE="${{ inputs.asset_mode || 'ranking' }}"
          NB=$(( NB < 1 ? 1 : (NB > 10 ? 10 : NB) ))
          ANGLES=$(python3 -c "print(','.join('A%02d' % i for i in range(1, int('$NB')+1)))")
          echo "Contrat opérateur : $NB clip(s), mode $MODE, angles=[$ANGLES]"
          cd MONDES_FORGES/CLIPPING/F04_COPYWRITER/CODEBASE
          git config user.name "OracleF04"
          git config user.email "oracle@perturabo.iron"
          IFS=',' read -ra LIST <<< "$ANGLES"
          for ANGLE in "${LIST[@]}"; do
            echo "=== CLIP $ANGLE ==="
            python copywriter.py --setup-context --angle "$ANGLE" \
              --platform "${{ inputs.platform }}" --market "${{ inputs.market }}" \
              || { echo "::warning::CLIP $ANGLE setup échoué"; continue; }
            python copywriter.py --generate-overlay --angle "$ANGLE" \
              --asset-mode "$MODE" --example-description "${{ inputs.example_description }}" \
              || { echo "::warning::CLIP $ANGLE generate échoué"; continue; }
            python copywriter.py --finalize-overlay --angle "$ANGLE" \
              --asset-mode "$MODE" || true

            # Résilience : on commite CE clip immédiatement (un échec n'efface plus les autres)
            cd "$GITHUB_WORKSPACE"
            mkdir -p MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting
            cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/overlay_payload_$ANGLE.json MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
            cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/overlay_payload_$ANGLE.md   MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
            cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/text_payload_$ANGLE.json MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
            cp MONDES_FORGES/CLIPPING/F04_COPYWRITER/OUT/text_payload_$ANGLE.md   MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting/ 2>/dev/null || true
            git add MONDES_FORGES/CLIPPING/ARCHIVUM/copywriting
            git commit -m "[F04] $ANGLE copywriting PUR ($MODE) -> ARCHIVUM/copywriting" || echo "rien à commiter"

            # Pause anti-limite NVIDIA entre clips
            cd MONDES_FORGES/CLIPPING/F04_COPYWRITER/CODEBASE
            sleep 4
          done

          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::push échoué"

      - name: Persister le relais oracle (questions/réponses)
        if: always()
        run: bash .github/scripts/persist_oracle_relay.sh "${{ github.ref_name }}"
