# PARI DAILY — Cron du monde forge PARI
# Radar du matin → analyse → pari pack → dashboard → artefacts commités → Telegram
#
# Creds Telegram (au choix, dans l'ordre de priorité) :
#   1. Secrets GitHub : TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (optionnel)
#   2. Fichier versionné MONDES_FORGES/PARI/env_pari (ou .env) — chargé par notifier.py
#   3. Sinon chat inféré via getUpdates (il faut avoir écrit au bot au moins une fois)
#   4. Sinon : le pipeline tourne et commit ses artefacts quand même — pas de push Telegram
#
# Secrets optionnels :
#   API_FOOTBALL_KEY    (fixtures live plus tard)
#   FOOTBALL_DATA_ORG_KEY
#   ORACLE_API_KEY      (TYRANT/HERALD LLM)

name: pari-daily
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC — le matin, avant les matchs
  workflow_dispatch: {}     # lancement manuel

permissions:
  contents: write

jobs:
  siege:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capteurs + Radar (donnée réelle) ou Démo si pas de carte
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: |
          cd MONDES_FORGES/PARI
          if [ -f ARCHIVUM/fixtures/matches.json ]; then
            # 1. stats live football-data.co.uk (sans clé) — fusion saison précédente
            python F00_RADAR/CODEBASE/capteurs.py build-stats --league E0 --season 2627 \
              --include-seasons 2526 --last 12 --out ARCHIVUM/teams/E0_2627.json || true
            # 2. Elo ClubElo (sans clé, gracieux si indisponible)
            python F00_RADAR/CODEBASE/capteurs.py build-elo --date $(date -u +%F) \
              --out ARCHIVUM/teams/elo_du_jour.json || true
            # 3. inject stats+Elo dans la carte (noms corrigés à la main si manquants)
            python F00_RADAR/CODEBASE/capteurs.py inject --stats ARCHIVUM/teams/E0_2627.json \
              --carte ARCHIVUM/fixtures/matches.json \
              --elo ARCHIVUM/teams/elo_du_jour.json || true
            # 4. radar sur donnée réelle
            python ORCHESTRATOR/CODEBASE/orchestrator.py --mode radar \
              --fixtures ARCHIVUM/fixtures/matches.json
          else
            echo "Pas de carte du jour (ARCHIVUM/fixtures/matches.json) — démo"
            python ORCHESTRATOR/CODEBASE/orchestrator.py --mode demo
          fi

      - name: Commit artefacts
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI
          git diff --staged --quiet || git commit -m "🛡️ PARI: siège quotidien (artefacts radar/pack/dashboard)"
          git push

      - name: Telegram — push du radar (+ pack si présent)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # notifier.py charge lui-même MONDES_FORGES/PARI/.env ou env_pari si les
          # secrets GitHub sont absents, sinon il déduit le chat via getUpdates.
          cd MONDES_FORGES/PARI
          python ORCHESTRATOR/CODEBASE/notifier.py \
            --radar SHARED/OUT/RADAR.md \
            --pack F05_PACKAGER/OUT/pari_pack.json
