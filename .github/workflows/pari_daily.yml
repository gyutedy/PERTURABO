# PARI DAILY — Cron du monde forge PARI
# Radar du matin → analyse → pari pack → dashboard → artefacts commités → Telegram
#
# Creds Telegram (au choix, dans l'ordre de priorité) :
#   1. Secrets GitHub : TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (optionnel)
#   2. Fichier versionné MONDES_FORGES/PARI/env_pari (ou .env) — chargé par notifier.py
#   3. Sinon chat inféré via getUpdates (il faut avoir écrit au bot au moins une fois)
#   4. Sinon : le pipeline tourne et commit ses artefacts quand même — pas de push Telegram
#
# Secrets optionnels :
#   API_FOOTBALL_KEY    (fixtures live plus tard)
#   FOOTBALL_DATA_ORG_KEY
#   ORACLE_API_KEY      (TYRANT/HERALD LLM)

name: pari-daily
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC — le matin, avant les matchs
  workflow_dispatch:
    # campagne déclenchée par l'opérateur (Telegram / bouton) — v2
    inputs:
      tickets_mode:
        description: "Compose les tickets (1 = oui)"
        default: "0"
        required: false
      budget_fc:
        description: "Budget du jour en FC (backroll)"
        default: "0"
        required: false
      surticket_fc:
        description: "Mise du ticket sûr en FC"
        default: "0"
        required: false
      combos:
        description: "Nombre de tickets"
        default: "3"
        required: false
      jambes:
        description: "Matchs par ticket ex: 3:2:2"
        default: ""
        required: false
      taux_fc_usd:
        description: "Taux FC→USD (unités 1u=1% bankroll)"
        default: ""
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  siege:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capteurs + Radar (donnée réelle) ou Démo si pas de carte
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: |
          cd MONDES_FORGES/PARI
          if [ -f ARCHIVUM/fixtures/matches.json ]; then
            # 1. stats live football-data.co.uk (sans clé) — fusion saison précédente
            python F00_RADAR/CODEBASE/capteurs.py build-stats --league E0 --season 2627 \
              --include-seasons 2526 --last 12 --out ARCHIVUM/teams/E0_2627.json || true
            # 2. Elo ClubElo (sans clé, gracieux si indisponible)
            python F00_RADAR/CODEBASE/capteurs.py build-elo --date $(date -u +%F) \
              --out ARCHIVUM/teams/elo_du_jour.json || true
            # 3. inject stats+Elo dans la carte (noms corrigés à la main si manquants)
            python F00_RADAR/CODEBASE/capteurs.py inject --stats ARCHIVUM/teams/E0_2627.json \
              --carte ARCHIVUM/fixtures/matches.json \
              --elo ARCHIVUM/teams/elo_du_jour.json || true
            # 4. radar sur donnée réelle
            python ORCHESTRATOR/CODEBASE/orchestrator.py --mode radar \
              --fixtures ARCHIVUM/fixtures/matches.json
          else
            echo "Pas de carte du jour (ARCHIVUM/fixtures/matches.json) — démo"
            python ORCHESTRATOR/CODEBASE/orchestrator.py --mode demo
          fi

      - name: Tickets (v2, si demandé) — combinés + backroll + PREVIEW 2
        env:
          TICKETS_MODE: ${{ github.event.inputs.tickets_mode }}
          BUDGET_FC: ${{ github.event.inputs.budget_fc }}
          SURTICKET_FC: ${{ github.event.inputs.surticket_fc }}
          COMBOS: ${{ github.event.inputs.combos }}
          JAMBES: ${{ github.event.inputs.jambes }}
          TAUX_FC_USD: ${{ github.event.inputs.taux_fc_usd }}
        run: |
          cd MONDES_FORGES/PARI
          if [ "$TICKETS_MODE" = "1" ] && [ -f F03_FORGEWARD/OUT/top3.json ]; then
            CMD="--combos ${COMBOS:-3} --budget-fc ${BUDGET_FC:-0} --surticket-fc ${SURTICKET_FC:-0}"
            if [ -n "$JAMBES" ]; then CMD="$CMD --jambes $JAMBES"; fi
            if [ -n "$TAUX_FC_USD" ]; then CMD="$CMD --taux-fc-usd $TAUX_FC_USD"; fi
            echo "[tickets args] $CMD"
            python ORCHESTRATOR/CODEBASE/orchestrator.py --mode tickets $CMD
          else
            echo "[tickets] mode tickets non demandé (TICKETS_MODE=$TICKETS_MODE) — skip"
          fi

      - name: Commit artefacts (previews + tickets inclus)
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI
          git diff --staged --quiet || git commit -m "🛡️ PARI: siège quotidien (artefacts radar/pack/dashboard/preview1/preview2/tickets)"
          git push

      - name: Telegram — push du radar (+ pack si présent, + ticket final s'il existe)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # notifier.py charge lui-même MONDES_FORGES/PARI/.env ou env_pari si les
          # secrets GitHub sont absents, sinon il déduit le chat via getUpdates.
          cd MONDES_FORGES/PARI
          python ORCHESTRATOR/CODEBASE/notifier.py \
            --radar SHARED/OUT/RADAR.md \
            --pack F05_PACKAGER/OUT/pari_pack.json
          # /data — les rangs Top 3 en message dédié (message spécial decisi,
          # jamais noye dans le ticket final) :
          if [ -f SHARED/OUT/TOP3.md ]; then
            python ORCHESTRATOR/CODEBASE/notifier.py --text "DATA — Top 3 marchés + score commun:\n$(cat SHARED/OUT/TOP3.md)"
          fi
          #/TICKETS.md (résumé du ticket final si composé) :
          if [ -f SHARED/OUT/TICKETS.md ]; then
            python ORCHESTRATOR/CODEBASE/notifier.py --text "$(cat SHARED/OUT/TICKETS.md)"
          fi
          # liens des previews (Pages) — avec URL du site
          SITE_URL="${{ steps.pages.outputs.page_url }}"
          if [ -n "$SITE_URL" ]; then
            python ORCHESTRATOR/CODEBASE/notifier.py \
              --text "VUES :\n• PREVIEW 1 (données brutes): $SITE_URL/preview1.html\n• PREVIEW 2 (ticket final): $SITE_URL/preview2.html"
          fi

  pages:
    needs: siege
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le site (previews + dashboard)
        run: |
          mkdir -p _site/jour
          cp MONDES_FORGES/PARI/SHARED/OUT/*.html _site/ 2>/dev/null || true
          cp MONDES_FORGES/PARI/SHARED/OUT/*.md _site/ 2>/dev/null || true
          ls -la _site

      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@v4
