name: PERTURABO VOX-C ANALYSIS (F00C)

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL YouTube (watch/youtu.be/live/shorts), Twitch (videos/<id> ou /<channel>) ou chemin local"
        required: true
      download_budget_seconds:
        description: "Budget de téléchargement en secondes (0 = metadata_only, > 0 = tranche analysée par heatmap)"
        required: false
        default: "0"
      heatmap_buckets:
        description: "Nombre de buckets de la heatmap (défaut 120)"
        required: false
        default: "120"
      to_candidats:
        description: "Émettre OUT/candidats.json au schéma canonique PUR (pont vers le tronc)"
        required: false
        default: "true"
      top_n:
        description: "Limiter aux N meilleurs segments (0 = tous)"
        required: false
        default: "0"
      media_source:
        description: "Média séparé de la source (chemin/URL directe) — optionnel, contrat découplé"
        required: false
        default: ""
      webhook_url:
        description: "URL du webhook Salle de Guerre (vide = pas de poussée)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: voxc-analysis-${{ github.event.inputs.source_url }}
  cancel-in-progress: false

jobs:
  voxc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer yt-dlp + numpy + deno (ffmpeg est préinstallé sur le runner)
        run: |
          pip install --quiet --upgrade yt-dlp numpy
          # deno = runtime JS requis par yt-dlp pour résoudre les challenges n/sig
          # (test local 2026-09-13 : sans runtime, formats manquants possibles)
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y >/dev/null 2>&1 \
            && echo "$HOME/.deno/bin" >> "$GITHUB_PATH" \
            || echo "::warning::deno non installé — certains formats YouTube peuvent manquer"

      - name: Restaurer cookies burner (secret YT_COOKIES_BASE64, si présent)
        env:
          YT_COOKIES_BASE64: ${{ secrets.YT_COOKIES_BASE64 }}
        run: |
          if [ -z "$YT_COOKIES_BASE64" ]; then
            echo "Pas de cookies configurés — essais sans session (player_client + comportement yt-dlp)."
            exit 0
          fi
          umask 077
          echo "$YT_COOKIES_BASE64" | base64 -d > /tmp/yt_cookies.txt
          echo "Cookies restaurés ($(wc -l < /tmp/yt_cookies.txt) lignes) — session burner, jamais loggée."

      - name: Gate L0 — la source doit être résoluble
        run: |
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          base = pathlib.Path("MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/CODEBASE")
          spec = importlib.util.spec_from_file_location("f00c_vox", base / "f00c_vox.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          try:
              resolved = module.resolve_source("${{ github.event.inputs.source_url }}")
          except Exception as exc:
              print(f"GATE L0 : ÉCHOUÉ — {exc}")
              sys.exit(1)
          print(f"GATE L0 : OK — kind={resolved['kind']} platform={resolved['platform']} id={resolved.get('id')}")
          PY

      - name: Analyse F00C_VOX (metadata + heatmap si budget > 0)
        env:
          SIEGE_WEBHOOK_TOKEN: ${{ secrets.SIEGE_WEBHOOK_TOKEN }}
          # Cerveau partagé : tri sémantique premium → repli oracle → off.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL: openai/gpt-oss-20b
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_MODEL: ${{ secrets.AI_GATEWAY_MODEL }}
        run: |
          EXTRA="--fetch-replayed"
          if [ -n "${{ github.event.inputs.webhook_url }}" ]; then
            EXTRA="$EXTRA --webhook-url ${{ github.event.inputs.webhook_url }}"
          fi
          if [ "${{ github.event.inputs.to_candidats }}" = "true" ]; then
            EXTRA="--to-candidats --candidats-out MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/candidats.json"
            if [ "${{ github.event.inputs.top_n }}" != "0" ] && [ -n "${{ github.event.inputs.top_n }}" ]; then
              EXTRA="$EXTRA --top ${{ github.event.inputs.top_n }}"
            fi
          fi
          if [ -f /tmp/yt_cookies.txt ]; then
            EXTRA="$EXTRA --cookies-file /tmp/yt_cookies.txt"
          fi
          if [ -n "${{ github.event.inputs.media_source }}" ]; then
            EXTRA="$EXTRA --media-source ${{ github.event.inputs.media_source }}"
          fi
          python3 MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/CODEBASE/f00c_vox.py \
            "${{ github.event.inputs.source_url }}" \
            --out MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/live_analysis.json \
            --heatmap-buckets ${{ github.event.inputs.heatmap_buckets }} \
            --download-budget-seconds ${{ github.event.inputs.download_budget_seconds }} \
            $EXTRA

      - name: GUARD — succès technique ≠ succès réel (exit 1 si média absent)
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          manifest_path = pathlib.Path("MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/live_analysis.json")
          if not manifest_path.exists():
              print("GUARD-FAIL : aucun manifeste produit.")
              sys.exit(1)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          budget = float("${{ github.event.inputs.download_budget_seconds }}" or 0)
          media_source = "${{ github.event.inputs.media_source }}"
          to_candidats = "${{ github.event.inputs.to_candidats }}" == "true"
          n_segments = len(manifest.get("viral_segments") or [])
          problems = []
          if not media_source and budget > 0 and manifest.get("status") != "full":
              problems.append(f"budget > 0 mais status={manifest.get('status')} — média non obtenu (anti-bot). Fournir YT_COOKIES_BASE64 ou media_source.")
          if to_candidats and budget > 0 and n_segments == 0:
              problems.append("budget > 0 mais 0 segment viral — heatmap absente ou plate.")
          if problems:
              for problem in problems:
                  print(f"GUARD-FAIL : {problem}")
              print("::error::Analyse fonctionnelle échouée : média non récupéré, heatmap absente ou aucun candidat produit.")
              sys.exit(1)
          print("GUARD : OK — analyse fonctionnelle réelle.")
          PY

      - name: Détruire les cookies burner (jamais laissés sur le runner)
        if: always()
        run: |
          rm -f /tmp/yt_cookies.txt
          echo "Cookies détruits."

      - name: Résumé du manifeste (gate L1)
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest_path = pathlib.Path("MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/live_analysis.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          print(f"Schéma      : {manifest['schema_version']}")
          print(f"Statut      : {manifest['status']}")
          print(f"Plateforme  : {manifest['source']['platform']} | type : {manifest['source']['content_type']}")
          print(f"Segments    : {len(manifest['viral_segments'])}")
          for seg in manifest["viral_segments"][:5]:
              print(f"  #{seg['rank']} {seg['start_sec']}s → {seg['end_sec']}s (attention {seg['attention_norm']})")
          if manifest["status"] == "metadata_only" and not manifest["viral_segments"]:
              print("Note : metadata_only — relancer avec download_budget_seconds > 0 pour la heatmap.")
          PY

      - name: Artefact voxc-analysis (manifeste)
        uses: actions/upload-artifact@v4
        with:
          name: voxc-analysis-${{ github.run_id }}
          path: MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/live_analysis.json
          if-no-files-found: error

      - name: Artefact voxc-candidats (schéma canonique PUR)
        if: ${{ github.event.inputs.to_candidats == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: voxc-candidats-${{ github.run_id }}
          path: MONDES_FORGES/CLIPPING/F00_IRON_SENTINEL/F00C_VOX/OUT/candidats.json
          if-no-files-found: warn

      - name: Persister le relais oracle (questions/réponses)
        if: always()
        run: bash .github/scripts/persist_oracle_relay.sh "${{ github.ref_name }}"
