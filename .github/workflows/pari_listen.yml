# PARI LISTEN — une commande Telegram = un run
# Relais : Cloudflare Worker (webhook) → workflow_dispatch → workflow.py
# Le Worker a deja filtre chat_id. Ici on execute, on commit, on repond
# via notifier.py (tell() dans workflow.py).
#
# Inputs:
#   cmd              /start | /capture | /budget 6000 | /combos 3 | /valider-1 | ...
#   capture_text     corps markdown Winner Bet (uniquement pour /capture)
#   capture_file_id  file_id Telegram (photo / document image) — getFile puis OCR

name: pari-listen
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Commande passee a workflow.py"
        required: true
        type: string
      capture_text:
        description: "Markdown Winner Bet (meme message que /capture)"
        required: false
        default: ""
        type: string
      capture_file_id:
        description: "Telegram file_id (photo ou document image, caption /capture)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pari-campagne
  cancel-in-progress: false

jobs:
  commande:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ecrire env_pari depuis les Secrets GitHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          WHOSCORED_KEY: ${{ secrets.WHOSCORED_KEY }}
          RAPIDAPI_WHOSCORED_KEY: ${{ secrets.RAPIDAPI_WHOSCORED_KEY }}
          WHOSCORED_HOST: ${{ secrets.WHOSCORED_HOST }}
          SOFASCORE_RAPIDAPI_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          SOFASCORE_HOST: ${{ secrets.SOFASCORE_HOST }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_BASE_URL: ${{ secrets.ORACLE_BASE_URL }}
          ORACLE_MODEL: ${{ secrets.ORACLE_MODEL }}
          ZRO_API_KEY: ${{ secrets.ZRO_API_KEY }}
          ZRO_BASE_URL: ${{ secrets.ZRO_BASE_URL }}
          ZRO_MODEL: ${{ secrets.ZRO_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PARI_WINNER_LLM_KEY: ${{ secrets.PARI_WINNER_LLM_KEY }}
          PARI_WINNER_LLM_BASE_URL: ${{ secrets.PARI_WINNER_LLM_BASE_URL }}
          PARI_WINNER_LLM_MODEL: ${{ secrets.PARI_WINNER_LLM_MODEL }}
        run: python3 .github/scripts/write_env_pari.py

      - name: tesseract OCR (capture png/jpg)
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tesseract-ocr tesseract-ocr-fra
          tesseract --version | head -1

      - name: Inbox capture Telegram (texte ou photo)
        env:
          CAPTURE_TEXT: ${{ github.event.inputs.capture_text }}
          CAPTURE_FILE_ID: ${{ github.event.inputs.capture_file_id }}
          CMD: ${{ github.event.inputs.cmd }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cd MONDES_FORGES/PARI
          python3 ORCHESTRATOR/LISTEN/inbox_capture.py

      - name: Winner vision (photo /winner -> slate)
        if: startsWith(github.event.inputs.cmd, '/winner') && github.event.inputs.capture_file_id != ''
        env:
          CMD: ${{ github.event.inputs.cmd }}
          WINNER_FILE_ID: ${{ github.event.inputs.capture_file_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PARI_WINNER_LLM_KEY: ${{ secrets.PARI_WINNER_LLM_KEY }}
          PARI_WINNER_LLM_BASE_URL: ${{ secrets.PARI_WINNER_LLM_BASE_URL }}
          PARI_WINNER_LLM_MODEL: ${{ secrets.PARI_WINNER_LLM_MODEL }}
        run: |
          cd MONDES_FORGES/PARI
          python3 ORCHESTRATOR/LISTEN/winner_telegram.py

      - name: Capture LLM (photo /capture -> tableau Winner)
        if: startsWith(github.event.inputs.cmd, '/capture') && github.event.inputs.capture_file_id != ''
        env:
          CMD: ${{ github.event.inputs.cmd }}
          CAPTURE_FILE_ID: ${{ github.event.inputs.capture_file_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PARI_WINNER_LLM_KEY: ${{ secrets.PARI_WINNER_LLM_KEY }}
          PARI_WINNER_LLM_BASE_URL: ${{ secrets.PARI_WINNER_LLM_BASE_URL }}
          PARI_WINNER_LLM_MODEL: ${{ secrets.PARI_WINNER_LLM_MODEL }}
        run: |
          cd MONDES_FORGES/PARI
          python3 ORCHESTRATOR/LISTEN/capture_llm.py

      - name: Executer workflow.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          CMD: ${{ github.event.inputs.cmd }}
          PARI_AUTO_GATES: "1"
        run: |
          cd MONDES_FORGES/PARI
          echo "[listen] cmd=$CMD"
          python ORCHESTRATOR/CODEBASE/workflow.py $CMD

      - name: Commit artefacts
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI
          git diff --staged --quiet || git commit -m "PARI: commande Telegram ${{ github.event.inputs.cmd }}"
          git push

  pages:
    needs: commande
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer le site (previews + dashboard)
        run: |
          mkdir -p _site
          cp MONDES_FORGES/PARI/SHARED/OUT/*.html _site/ 2>/dev/null || true
          cp MONDES_FORGES/PARI/SHARED/OUT/*.md _site/ 2>/dev/null || true
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: pages
        continue-on-error: true
