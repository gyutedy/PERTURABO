# PARI LISTEN — une commande Telegram = un run
# Relais : Cloudflare Worker (webhook) → workflow_dispatch → workflow.py
# Le Worker a deja filtre chat_id. Ici on execute, on commit, on repond
# via notifier.py (tell() dans workflow.py).
#
# Inputs:
#   cmd              /start | /capture | /budget 6000 | /combos 3 | /valider-1 | ...
#   capture_text     corps markdown Winner Bet (uniquement pour /capture)
#   capture_file_id  file_id Telegram (photo / document image) — getFile puis OCR

name: pari-listen
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Commande passee a workflow.py"
        required: true
        type: string
      capture_text:
        description: "Markdown Winner Bet (meme message que /capture)"
        required: false
        default: ""
        type: string
      capture_file_id:
        description: "Telegram file_id (photo ou document image, caption /capture)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pari-campagne
  cancel-in-progress: false

jobs:
  commande:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tesseract OCR (capture png/jpg)
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tesseract-ocr tesseract-ocr-fra
          tesseract --version | head -1

      - name: Inbox capture Telegram (texte ou photo)
        env:
          CAPTURE_TEXT: ${{ github.event.inputs.capture_text }}
          CAPTURE_FILE_ID: ${{ github.event.inputs.capture_file_id }}
          CMD: ${{ github.event.inputs.cmd }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          cd MONDES_FORGES/PARI
          python3 << 'PY'
          import json, os, urllib.request
          from pathlib import Path

          def load_token():
              t = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
              if t:
                  return t
              p = Path("env_pari")
              if not p.exists():
                  return ""
              for line in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  if k.strip() == "TELEGRAM_BOT_TOKEN":
                      return v.strip().strip('"').strip("'")
              return ""

          inbox = Path("F01_SENTINEL/IN")
          inbox.mkdir(parents=True, exist_ok=True)
          file_id = (os.environ.get("CAPTURE_FILE_ID") or "").strip()
          text = os.environ.get("CAPTURE_TEXT") or ""
          cmd = os.environ.get("CMD") or ""
          if file_id:
              token = load_token()
              if not token:
                  print("[listen] capture_file_id sans TELEGRAM_BOT_TOKEN — skip download")
              else:
                  api = "https://api.telegram.org"
                  url = api + "/bot" + token + "/getFile?file_id=" + urllib.request.quote(file_id)
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          blob = json.loads(r.read().decode("utf-8", errors="replace"))
                  except Exception as e:
                      print("[listen] getFile echec:", type(e).__name__)
                      blob = {}
                  fpath = ((blob.get("result") or {}).get("file_path") or "") if blob.get("ok") else ""
                  if not fpath:
                      print("[listen] getFile sans file_path — trou, pas d invention")
                  else:
                      ext = Path(fpath).suffix.lower() or ".jpg"
                      if ext not in (".png", ".jpg", ".jpeg", ".webp"):
                          ext = ".jpg"
                      dest = inbox / ("capture_telegram" + ext)
                      file_url = api + "/file/bot" + token + "/" + fpath
                      try:
                           with urllib.request.urlopen(file_url, timeout=60) as r:
                               dest.write_bytes(r.read())
                           print("[listen] photo inbox", dest.name, dest.stat().st_size, "octets")
                           md_old = inbox / "capture_telegram.md"
                           if md_old.exists():
                               md_old.unlink()
                               print("[listen] retire leftover", md_old.name)
                       except Exception as e:
                           print("[listen] download photo echec:", type(e).__name__)
          elif text.strip():
              dest = inbox / "capture_telegram.md"
              dest.write_text(text if text.endswith("\n") else text + "\n", encoding="utf-8")
              print("[listen] inbox md", dest.stat().st_size, "octets")
              for ext in (".png", ".jpg", ".jpeg", ".webp"):
                  old = inbox / ("capture_telegram" + ext)
                  if old.exists():
                      old.unlink()
                      print("[listen] retire leftover", old.name)
          else:
              print("[listen] pas de capture (cmd=%s)" % cmd)
          PY

      - name: Executer workflow.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          CMD: ${{ github.event.inputs.cmd }}
          PARI_AUTO_GATES: "1"
        run: |
          cd MONDES_FORGES/PARI
          echo "[listen] cmd=$CMD"
          python ORCHESTRATOR/CODEBASE/workflow.py $CMD

      - name: Commit artefacts
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI
          git diff --staged --quiet || git commit -m "PARI: commande Telegram ${{ github.event.inputs.cmd }}"
          git push

  pages:
    needs: commande
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparer le site (previews + dashboard)
        run: |
          mkdir -p _site
          cp MONDES_FORGES/PARI/SHARED/OUT/*.html _site/ 2>/dev/null || true
          cp MONDES_FORGES/PARI/SHARED/OUT/*.md _site/ 2>/dev/null || true
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: pages
        continue-on-error: true
