# PARI ODDS T-2h — rescan cotes The Odds API si un match est dans 3h.
# Cle ODDS_API_KEY (alias THE_ODDS_API_KEY) depuis env_pari (pas GitHub Secrets).
# Absente = skip (job vert). Jamais scrape Winner. Jamais Poisson.
# Kill switch PARI_SKIP_ODDS=1.

name: pari-odds-t2h
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pari-odds-t2h
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Odds watch T-2h
        env:
          PARI_AUTO_GATES: "1"
        run: |
          cd MONDES_FORGES/PARI
          python F00_RADAR/CODEBASE/odds_watch.py --notify

      - name: Commit snapshot odds
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI/ARCHIVUM/odds
          git diff --staged --quiet || git commit -m "PARI: snapshot odds T-2h"
          git push
