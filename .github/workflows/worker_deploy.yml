# PARI LISTEN — deploy Cloudflare Worker quand LISTEN/** change.
# Creds depuis les Secrets GitHub, ecrits dans env_pari au runtime :
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# Absents = skip (pas d echec rouge). Pas de wrangler manuel. Pas de webhook Telegram ici.

name: pari-worker-deploy
on:
  push:
    branches:
      - pari-winner-sensor-m1
    paths:
      - "MONDES_FORGES/PARI/ORCHESTRATOR/LISTEN/**"
      - ".github/workflows/worker_deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ecrire env_pari depuis les Secrets GitHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          WHOSCORED_KEY: ${{ secrets.WHOSCORED_KEY }}
          RAPIDAPI_WHOSCORED_KEY: ${{ secrets.RAPIDAPI_WHOSCORED_KEY }}
          WHOSCORED_HOST: ${{ secrets.WHOSCORED_HOST }}
          SOFASCORE_RAPIDAPI_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          SOFASCORE_HOST: ${{ secrets.SOFASCORE_HOST }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_BASE_URL: ${{ secrets.ORACLE_BASE_URL }}
          ORACLE_MODEL: ${{ secrets.ORACLE_MODEL }}
          ZRO_API_KEY: ${{ secrets.ZRO_API_KEY }}
          ZRO_BASE_URL: ${{ secrets.ZRO_BASE_URL }}
          ZRO_MODEL: ${{ secrets.ZRO_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/write_env_pari.py

      - name: Charger CLOUDFLARE_* depuis env_pari
        id: creds
        run: |
          python3 << 'PY'
          import os
          from pathlib import Path
          p = Path("MONDES_FORGES/PARI/env_pari")
          vals = {}
          if p.exists():
              for line in p.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  k, v = line.split("=", 1)
                  k, v = k.strip(), v.strip().strip('"').strip("'")
                  if k in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID") and v:
                      vals[k] = v
          gh_env = os.environ["GITHUB_ENV"]
          gh_out = os.environ["GITHUB_OUTPUT"]
          if vals.get("CLOUDFLARE_API_TOKEN") and vals.get("CLOUDFLARE_ACCOUNT_ID"):
              with open(gh_env, "a", encoding="utf-8") as f:
                  f.write(f"CLOUDFLARE_API_TOKEN={vals['CLOUDFLARE_API_TOKEN']}\n")
                  f.write(f"CLOUDFLARE_ACCOUNT_ID={vals['CLOUDFLARE_ACCOUNT_ID']}\n")
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write("present=1\n")
              print("[worker] env_pari CF keys present")
          else:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write("present=0\n")
              print("[worker] CLOUDFLARE_* absents de env_pari — skip deploy")
          PY

      - uses: cloudflare/wrangler-action@v3
        if: steps.creds.outputs.present == '1'
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: MONDES_FORGES/PARI/ORCHESTRATOR/LISTEN
          command: deploy
