name: PERTURABO — F05/F06 MONTAGE PUR (directeur viral)

on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: 'URL VOD traitée par VOX'
        required: true
        default: 'https://www.twitch.tv/videos/2864600351'
      candidats_path:
        description: 'Chemin candidats.json VOX (repo-relatif)'
        required: false
        default: 'MONDES_FORGES/CLIPPING/ARCHIVUM/montage/transcripts/v2864600351_candidats.json'
      platform:
        description: 'Plateforme cible'
        required: false
        default: 'youtube_shorts'
      market:
        description: 'Marché cible'
        required: false
        default: 'us_young_english'
      nb_videos:
        description: 'Nombre de clips (1-10)'
        required: false
        default: '3'
      asset_mode:
        description: 'Type de contenu : ranking | blur | split | overlay_only'
        required: false
        default: 'overlay_only'
      transcript_path:
        description: 'Chemin transcript word-timestamps (vide = auto derive de candidats)'
        required: false
        default: ''

jobs:
  montage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Montage PUR (directeur viral + pack complet)
        run: |
          python MONDES_FORGES/CLIPPING/pur_montage_pipeline.py \
            --candidats "${{ inputs.candidats_path }}" \
            --vod "${{ inputs.vod_url }}" \
            --platform "${{ inputs.platform }}" \
            --market "${{ inputs.market }}" \
            --nb-videos "${{ inputs.nb_videos }}" \
            --asset-mode "${{ inputs.asset_mode }}" \
            --transcript "${{ inputs.transcript_path }}"

      - name: Commit packs vers ARCHIVUM/montage/packs
        run: |
          git config user.name "DirectorF06"
          git config user.email "director@perturabo.iron"
          git add MONDES_FORGES/CLIPPING/ARCHIVUM/montage/packs
          git commit -m "[F05/F06] montage PUR (${{ inputs.asset_mode }} x${{ inputs.nb_videos }}) — packs viraux -> ARCHIVUM/montage/packs" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
