# PARI ODDS T-0 — snapshot cotes The Odds API a kickoff.
# En plus de T-2h. Cle ODDS_API_KEY depuis les Secrets GitHub (env_pari ecrit au runtime).
# Absente = skip (job vert). Jamais scrape Winner. Jamais Poisson.
# N ecrase PAS latest.json (T-2h). Kill switch PARI_SKIP_ODDS=1.

name: pari-odds-t0
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pari-odds-t0
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ecrire env_pari depuis les Secrets GitHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          WHOSCORED_KEY: ${{ secrets.WHOSCORED_KEY }}
          RAPIDAPI_WHOSCORED_KEY: ${{ secrets.RAPIDAPI_WHOSCORED_KEY }}
          WHOSCORED_HOST: ${{ secrets.WHOSCORED_HOST }}
          SOFASCORE_RAPIDAPI_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          SOFASCORE_HOST: ${{ secrets.SOFASCORE_HOST }}
          ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
          ORACLE_BASE_URL: ${{ secrets.ORACLE_BASE_URL }}
          ORACLE_MODEL: ${{ secrets.ORACLE_MODEL }}
          ZRO_API_KEY: ${{ secrets.ZRO_API_KEY }}
          ZRO_BASE_URL: ${{ secrets.ZRO_BASE_URL }}
          ZRO_MODEL: ${{ secrets.ZRO_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 .github/scripts/write_env_pari.py

      - name: Odds watch T-0 kickoff
        env:
          PARI_AUTO_GATES: "1"
        run: |
          cd MONDES_FORGES/PARI
          python F00_RADAR/CODEBASE/odds_watch.py --close --notify

      - name: Commit snapshot T-0
        run: |
          git config user.name "IW_CUSTOS[bot]"
          git config user.email "custos@perturabo.iron"
          git add MONDES_FORGES/PARI/ARCHIVUM/odds
          git diff --staged --quiet || git commit -m "PARI: snapshot odds T-0 kickoff"
          git push
